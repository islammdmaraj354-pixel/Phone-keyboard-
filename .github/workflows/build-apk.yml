name: Build Bangla Keyboard APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          unzip -o Bangla_Anywhere_Keyboard_Offline_Bidirectional_v1.1.zip

      - name: Build APK
        run: |
          cd BanglaAnywhereKeyboard
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Anywhere-Keyboard-APK
          path: BanglaAnywhereKeyboard/app/build/outputs/apk/debug/app-debug.apk
